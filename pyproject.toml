[project]
name = "openreview"
version = "0.1.0"
description = "从 OpenReview 拉取顶会论文，按关键词和审稿评分筛选，再调用 Gemini 逐篇解读"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.61.0",
    "jinja2>=3.1.6",
    "markdown>=3.10.1",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "openreview-py>=2.9.3",
    "pandas>=3.0.0",
    "pandas-stubs~=3.0.0",
    "pyotp>=2.9.0",
    "pypdf>=6.6.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "tqdm>=4.67.2",
    "wordcloud>=1.9.6",
]
