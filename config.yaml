# OpenReview 论文分析爬虫配置文件

# ==================== API配置 ====================
api:
  # Gemini API Key (建议从环境变量读取: GEMINI_API_KEY)
  gemini_api_key: "AIzaSyCe_k-GGycWNnE5IoIA3ni32kW5gTZDmr0"
  gemini_model: "gemini-3-pro-preview"  # 可选: gemini-2.5-flash (最新), gemini-2.0-flash, gemini-flash-latest
  openreview_base_url: "https://api2.openreview.net"

# ==================== 会议配置 ====================
conferences:
  - name: "ICLR"
    year: 2026
    invitation: "ICLR.cc/2026/Conference/-/Submission"
  
  - name: "NeurIPS"
    year: 2025
    invitation: "NeurIPS.cc/2025/Conference/-/Submission"
  
  - name: "ICML"
    year: 2025
    invitation: "ICML.cc/2025/Conference/-/Submission"
  
  - name: "CVPR"
    year: 2025
    invitation: "CVPR.cc/2025/Conference/-/Submission"

# 当前使用的会议 (索引，0表示第一个)
active_conference_index: 0

# ==================== 筛选条件 ====================
filtering:
  # 关键词列表 (支持正则表达式)
  keywords:
#    - "multimodal"
#    - "MLLM"
#    - "VLM"
#    - "vision-language"
#    - "vision language"
#    - "multi-modal"
#    - "LMM"
#    - "LVLM"
#    - "Video-LLM"
#    - "Video Understanding"
#    - "Long-context Video"
#    - "MoE"
#    - "Mamba"
#    - "Token Pruning"
#    - "Token Merging"
#    - "Sparse Attention"
#    - "Multimodal CoT"
#    - "Chain-of-Thought"
    - "TTT"
    - "Test-Time Training"
    - "TTS"
    - "Test-time Scaling"
    - "in-context learning"
    - "context learning"

  # 评分门槛
  score_threshold: 5.0
  
  # 是否使用正则表达式匹配 (使用词边界，避免误判)
  use_regex: true
  
  # 是否使用词干提取 (需要nltk，可选)
  use_stemming: false

# ==================== 爬取模式 ====================
analysis:
  # 模式: "SIMPLE" (仅摘要/快速) 或 "FULL" (下载PDF全文/深度分析)
  mode: "FULL"
  
  # PDF处理配置
  max_pdf_pages: 15        # PDF最大解析页数
  max_text_length: 100000   # 送入AI的最大文本长度
  pdf_timeout: 15          # PDF下载超时时间(秒)

# ==================== 并发配置 ====================
concurrency:
  max_workers: 10  # 最大并发线程数

# ==================== 速率限制配置 ====================
rate_limit:
  openreview:
    max_requests: 58       # 每个时间窗口最大请求数
    time_window: 60        # 时间窗口(秒)
  
  gemini:
    max_requests: 1000     # Gemini Tier 1 高配额
    time_window: 60

# ==================== 重试配置 ====================
retry:
  max_retries: 3           # 最大重试次数
  base_delay: 0.5          # 基础延迟时间(秒)

# ==================== Prompt模板配置 ====================
prompts:
  simple_mode: |
    你是一个精通多模态大模型（MLLM）的顶会审稿人。请根据以下 {conference} {year} 的论文元数据，快速提炼核心情报。

    论文信息：
    标题: {title}
    摘要/TL;DR: {tldr}

    请以Markdown格式输出，要求简练、直击要害：

    1. **中文标题**: [翻译]
    2. **核心标签**: [给出3-5个Tags，如：#指令微调 #幻觉消除 #MoE架构 #长视频理解]
    3. **一句话贡献**: [用"本文提出了..."句式，概括它解决了什么具体问题]
    4. **创新点摘要**:
       - [点1]
       - [点2]
    5. **对MLLM研究的启发**: [如果这篇论文不是直接做MLLM的，请思考其方法论（如数据配对、训练Loss、模型压缩）能如何迁移到MLLM中？]
    6. **推荐指数 (1-10分)**: [基于该工作的新颖性和对MLLM社区的潜在影响打分]

  full_mode: |
    你是一名正在寻找顶会Paper Idea的 AI 博士研究员。请阅读这篇 {conference} {year} 的论文全文，进行深度结构化剖析。你的目标是挖掘技术细节、数据策略以及发现其潜在的研究缺口（Gap）。

    论文标题: {title}
    论文内容片段:
    {context_text}

    ---
    请严格按照以下结构输出，内容需详实且具有技术深度：

    ### 1. 论文画像
    * **中文标题**:
    * **细分领域**: [如：VLA / Document Understanding / Video-LLM / Efficient Training]
    * **核心痛点 (Motivation)**: [作者认为当前领域存在什么具体阻碍？]
    * **一句话解决方案**: [Method的核心逻辑]

    ### 2. 技术解构 (The "How")
    * **模型架构**:
      - **视觉编码器**: [如 CLIP, SigLIP, VQ-VAE...]
      - **模态对齐层**: [如 MLP, Q-Former, Cross-attention...]
      - **LLM基座**: [如 LLaMA-3, Vicuna, Mistral...]
    * **训练策略**: [从头预训练还是微调？基于什么基座？]
    * **关键算法/创新**: [详细描述其Loss设计、训练阶段划分或特殊的模块设计]
    * **数据策略**: [重要！总结其预训练数据来源、指令微调数据的构建方式或合成数据策略]
  

    ### 3. 实验与结论
    * **SOTA对比**: [在哪些关键Benchmark上取得了优势？]
    * **消融实验结论**: [哪个模块或策略被证明是最有效的？]

    ### 4. 博士生视角 (Critical Thinking)
    * **Idea 启发 (Takeaway)**: [即使我不复现它，我能从它的设计思路中学到什么？例如：利用时序相关性、利用MoE降低计算量等]
    * **局限性与Gap**: [基于文中提到的Limitations或你的判断，这篇论文还有什么没解决好？这可能是我的下一个Paper方向]
    * **适合应用场景**: [端侧部署/大规模预训练/特定垂直领域]

# ==================== 输出配置 ====================
output:
  # 输出根目录
  base_dir: "analyses"

  # 输出格式开关
  formats:
    excel: true       # 生成Excel文件 (包含摘要，前N字符)
    html: true        # 生成HTML报告 (完整内容，Markdown渲染)
    markdown: true    # 生成Markdown文件夹 (每篇论文一个文件)
    csv: false        # 是否同时生成CSV

  # Excel格式配置
  excel:
    summary_length: 500        # AI分析摘要长度 (字符数)
    auto_adjust_width: true    # 自动调整列宽
    enable_wrap_text: true     # 启用文本换行

  # 统计报告配置
  statistics:
    enable: true               # 是否生成统计报告
    charts:
      - "rating_distribution"  # 评分分布柱状图
      - "keyword_wordcloud"    # 关键词词云
      - "direction_pie"        # 研究方向饼图 (暂未实现)

# ==================== 日志配置 ====================
logging:
  level: "INFO"                           # DEBUG, INFO, WARNING, ERROR
  file: "logs/openreview_crawler.log"
  console: true                           # 是否输出到控制台
  audit_log: true                         # 是否记录审计日志 (API调用次数、耗时等)

